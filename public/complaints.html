<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>שליחת תלונה חדשה</h1>
    </header>
    <main>
      <form>
        <label for="complaint-domain" class="form-label">בחר תחום:</label>
        <select id="complaint-domain" name="complaint-domain" required>
          <option value="" disabled selected>בחר תחום</option>
          <option value="food">אוכל</option>
          <option value="equipment">ציוד</option>
          <option value="commands">פקודות</option>
          <option value="other">אחר</option>
        </select>
        <label for="complaint-text" class="form-label">התלונה שלך:</label>
        <textarea id="complaint-text" name="complaint-text" required></textarea>

        <button type="submit" class="button">שליחה</button>
      </form>
    </main>
  </body>
</html>
